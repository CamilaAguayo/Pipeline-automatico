# Tema del panel: superficies y tintas de la paleta validada (modo oscuro).
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
